# SPDX-License-Identifier: Apache-2.0
[workspace]
resolver = "2"
members = ["crates/graft", "crates/graft-cas", "crates/graft-compile", "crates/graft-score"]
default-members = ["crates/graft"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/eonik-ai/graft"
homepage = "https://github.com/eonik-ai/graft"
rust-version = "1.85"
authors = ["eonik"]
publish = false

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
graft-cas = { path = "crates/graft-cas" }
graft-compile = { path = "crates/graft-compile" }
graft-score = { path = "crates/graft-score" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
